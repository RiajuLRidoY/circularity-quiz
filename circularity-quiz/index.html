<script>
// Works on any address: uses the page's own URL for sharing
const SITE_URL = location.origin + location.pathname;

function burst(el, count) {
  if (reduceMotion || !el.isConnected) return;
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < count; i++) {
    const p = document.createElement("span");
    p.className = "confetti";
    const w = 6 + Math.random() * 8, h = 4 + Math.random() * 6;
    p.style.cssText = `left:${cx}px;top:${cy}px;width:${w}px;height:${h}px;background:${colours[i % colours.length]}`;
    document.body.appendChild(p);
    const angle = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 120;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist + 40;
    const spin = Math.random() * 540 - 270;
    p.animate([
      { transform: "translate(-50%,-50%) rotate(0deg)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${spin}deg)`, opacity: 0 }
    ], { duration: 900 + Math.random() * 400, easing: "cubic-bezier(.15,.7,.4,1)" }).onfinish = () => p.remove();
  }
}

function plusOne(el) {
  if (reduceMotion) return;
  const r = el.getBoundingClientRect();
  const t = document.createElement("span");
  t.className = "plus-one";
  t.textContent = "+1";
  t.style.left = (r.left + r.width / 2 - 12) + "px";
  t.style.top = (r.top - 10) + "px";
  document.body.appendChild(t);
  t.animate([
    { transform: "translateY(0)", opacity: 1 },
    { transform: "translateY(-40px)", opacity: 0 }
  ], { duration: 900, easing: "ease-out" }).onfinish = () => t.remove();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Live estimates, based on published annual figures
const VALUE_LOST_PER_SECOND = 25.4e12 / 31557600; // Circularity Gap Report 2026: EUR 25.4 trillion a year
const CIRCULARITY_RATE = 6.9; // Circularity Gap Report 2025
let liveTimer = null, orbitFrame = null;

function stopLive() {
  clearInterval(liveTimer);
  cancelAnimationFrame(orbitFrame);
  liveTimer = null; orbitFrame = null;
}

const truckSvg = `<svg viewBox="0 0 26 18" aria-hidden="true"><path fill="currentColor" d="M1 3h14v10H1zM16 6h5l4 4v3h-9z"/><circle cx="6" cy="15" r="2.4" fill="currentColor"/><circle cx="20" cy="15" r="2.4" fill="currentColor"/></svg>`;

function ringSvg() {
  const r = 92, c = 2 * Math.PI * r, arc = c * CIRCULARITY_RATE / 100;
  let dots = "";
  for (let i = 0; i < 9; i++) {
    const ang = (i / 9) * Math.PI * 2;
    dots += `<circle class="fibre" r="${3 + (i % 3)}" fill="${colours[i % colours.length]}" cx="${(120 + 112 * Math.cos(ang)).toFixed(2)}" cy="${(120 + 112 * Math.sin(ang)).toFixed(2)}"/>`;
  }
  return `
  <svg viewBox="0 0 240 240" role="img" aria-label="Ring chart: ${CIRCULARITY_RATE}% of materials entering the global economy are recycled materials">
    <circle class="orbit" cx="120" cy="120" r="112"/>
    <circle class="ring-track" cx="120" cy="120" r="${r}"/>
    <circle class="ring-arc" cx="120" cy="120" r="${r}" style="--len:${arc.toFixed(1)}" stroke-dasharray="${arc.toFixed(1)} ${c.toFixed(1)}"/>
    <text class="ring-big" x="120" y="124" text-anchor="middle">${CIRCULARITY_RATE}%</text>
    <text class="ring-small" x="120" y="146" text-anchor="middle">circular</text>
    <g id="fibres">${dots}</g>
  </svg>`;
}

function startLive() {
  const started = performance.now();
  const trucksEl = document.getElementById("trucks");
  const valueEl = document.getElementById("value");
  const row = document.getElementById("truckRow");
  const euro = new Intl.NumberFormat("en-GB", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  let shownTrucks = 0;

  liveTimer = setInterval(() => {
    const secs = (performance.now() - started) / 1000;
    valueEl.textContent = euro.format(secs * VALUE_LOST_PER_SECOND);
    const trucks = Math.floor(secs);
    if (trucks !== shownTrucks) {
      shownTrucks = trucks;
      trucksEl.textContent = trucks.toLocaleString("en-GB");
      row.insertAdjacentHTML("beforeend", truckSvg);
      if (!reduceMotion) row.lastElementChild.classList.add("new");
      while (row.children.length > 24) row.firstElementChild.remove();
    }
  }, reduceMotion ? 1000 : 80);

  if (reduceMotion) return;
  const fibres = Array.from(document.querySelectorAll("#fibres .fibre"));
  const speeds = fibres.map((_, i) => 0.00018 + (i % 4) * 0.00006);
  const offsets = fibres.map((_, i) => (i / fibres.length) * Math.PI * 2);
  const tick = (t) => {
    fibres.forEach((f, i) => {
      const a = offsets[i] + t * speeds[i];
      f.setAttribute("cx", (120 + 112 * Math.cos(a)).toFixed(2));
      f.setAttribute("cy", (120 + 112 * Math.sin(a)).toFixed(2));
    });
    orbitFrame = requestAnimationFrame(tick);
  };
  orbitFrame = requestAnimationFrame(tick);
}

  stopLive();
  app.className = "";
  const q = questions[deck[current]];
  const label = practice ? `Practice round · ${current + 1} of ${deck.length}` : `Question ${current + 1} of ${deck.length}`;
  app.innerHTML = `
    ${progressBar()}

  `;

function choose(i) {
  const q = questions[deck[current]];
  const correct = i === q.answer;
  results.push({ qi: deck[current], picked: i, correct });

  app.querySelectorAll(".opt").forEach(btn => {
    const idx = parseInt(btn.dataset.i, 10);
    btn.disabled = true;
    if (idx === q.answer) btn.classList.add("is-right");
    else if (idx === i) btn.classList.add("is-wrong");
    else btn.classList.add("faded");
  });

  const chosen = app.querySelector(`.opt[data-i="${i}"]`);
  if (correct) { burst(chosen, 22); plusOne(chosen); }
  else app.querySelector(".tag").classList.add("wobble");

  const seg = app.querySelectorAll(".progress i")[current];
  if (seg) seg.className = correct ? "done-good" : "done-bad";

  const stamp = document.getElementById("stamp");
  stamp.textContent = correct ? "Spot on" : "Not quite";
  stamp.className = "stamp hidden " + (correct ? "good" : "bad");
  requestAnimationFrame(() => requestAnimationFrame(() => stamp.classList.remove("hidden")));

  const last = current === deck.length - 1;
  document.getElementById("feedback").innerHTML = `
    <div class="explain">
      <p><strong>${esc(q.options[q.answer])}.</strong> ${esc(q.right)}</p>
      <p>${esc(q.other)}</p>
    </div>
    <div class="next-row"><button class="primary" id="next">${last ? "See my score" : "Next question"}</button></div>
  `;
  const next = document.getElementById("next");
  next.onclick = () => {
    current++;
    if (current < deck.length) renderQuestion(); else renderResults();
    window.scrollTo({ top: 0 });
  };
  next.focus({ preventScroll: true });
}

function gaugeSvg() {
  const n = results.length, c = 110, r = 88;
  const pt = a => {
    const t = a * Math.PI / 180;
    return `${(c + r * Math.cos(t)).toFixed(2)} ${(c + r * Math.sin(t)).toFixed(2)}`;
  };
  let segs = "";
  results.forEach((res, i) => {
    const cls = `seg ${res.correct ? "good" : "bad"}`;
    const title = `<title>Question ${i + 1}: ${res.correct ? "correct" : "missed"}. Click to review.</title>`;
    const style = `animation-delay:${i * 70}ms`;
    if (n === 1) {
      segs += `<circle class="${cls}" data-pos="0" cx="${c}" cy="${c}" r="${r}" style="${style}">${title}</circle>`;
      return;
    }
    const span = 360 / n, gap = 13;
    const a0 = -90 + i * span + gap / 2, a1 = -90 + (i + 1) * span - gap / 2;
    const large = a1 - a0 > 180 ? 1 : 0;
    segs += `<path class="${cls}" data-pos="${i}" d="M ${pt(a0)} A ${r} ${r} 0 ${large} 1 ${pt(a1)}" style="${style}">${title}</path>`;
  });
  return `<svg viewBox="0 0 220 220" aria-hidden="true"><circle class="orbit" cx="${c}" cy="${c}" r="106"/>${segs}</svg>`;
}

function selectTab(name) {
  app.querySelectorAll('[role="tab"]').forEach(t => {
    const on = t.dataset.tab === name;
    t.setAttribute("aria-selected", String(on));
    t.tabIndex = on ? 0 : -1;
    document.getElementById(t.getAttribute("aria-controls")).hidden = !on;

}

function setFilter(f) {
  app.querySelectorAll(".filter button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === f)));

function toggleItem(li, force) {
  const open = force ?? !li.classList.contains("open");
  li.classList.toggle("open", open);
  li.querySelector(".rv-head").setAttribute("aria-expanded", String(open));
  li.querySelector(".rv-body").hidden = !open;
}

function openReview(pos) {
  const li = document.getElementById("rv-" + pos);
  if (!li) return;
  selectTab("review");
  if (li.hidden) setFilter("all");
  toggleItem(li, true);
  li.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" });
  li.classList.remove("flash");
  void li.offsetWidth;
  li.classList.add("flash");
  li.querySelector(".rv-head").focus({ preventScroll: true });
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    return ok;
  }
}

async function copyScore(btn, score, total) {
  const tier = tiers.find(t => score >= t.min);
  const grid = results.map(r => (r.correct ? "🟩" : "🟥")).join("");
  const text = `I scored ${score}/${total} on "Same same, but different?" ♻️\n${grid}\nRank: ${tier.name}\nHow many can you get right? ${SITE_URL}`;
  const status = document.getElementById("copyStatus");
  const old = app.querySelector(".copy-fallback");
  if (old) old.remove();
  if (await copyText(text)) {
    btn.textContent = "Copied!";
    status.textContent = "Copied. Paste it in the comments to share your score.";
    status.classList.add("ok");
    burst(btn, 14);
    setTimeout(() => { btn.textContent = "Copy my score"; }, 2500);
  } else {
    status.classList.remove("ok");
    status.textContent = "Couldn't copy automatically. Select the text below and copy it:";
    const ta = document.createElement("textarea");
    ta.className = "copy-fallback";
    ta.readOnly = true;
    ta.rows = 4;
    ta.value = text;
    status.after(ta);
    ta.focus();
    ta.select();
  }
}

function renderResults() {
  stopLive();
  app.className = "results";
  const total = deck.length;
  const score = results.filter(r => r.correct).length;
  const missedIdx = results.filter(r => !r.correct).map(r => r.qi);
  const missed = missedIdx.length;
  const countMs = reduceMotion ? 0 : 110 * (score + 1);

  let middle;
  if (practice) {
    const left = total - score;
    middle = `<p class="verdict">${score === total
      ? "All fixed. Those terms are yours now."
      : `You fixed ${score} of ${total}. Have another go at the ${left === 1 ? "one" : left} still tripping you up.`}</p>`;
  } else {
    const tier = tiers.find(t => score >= t.min);
    const next = tiersAsc.find(t => t.min > score);
    const ladder = tiersAsc.map((t, i) => {
      const upper = i < tiersAsc.length - 1 ? tiersAsc[i + 1].min - 1 : total;
      const range = t.min === upper ? `${upper}` : `${t.min}–${upper}`;
      const state = t === tier ? "current" : (t.min < tier.min ? "reached" : "");
      return `<li class="${state}"${t === tier ? ' aria-current="step"' : ""}><span class="l-name">${esc(t.name)}</span><span class="l-range">${range}</span></li>`;
    }).join("");
    const nudge = next
      ? `Get ${next.min - score} more right next time to reach <strong>${esc(next.name)}</strong>.`
      : "Top of the loop. Share your score and see who can match it.";
    middle = `
      <div class="rank-tag" style="animation-delay:${countMs}ms">
        <span class="rank-label">Your rank</span>
        <span class="rank-name">${esc(tier.name)}</span>
      </div>
      <p class="verdict">${esc(tier.msg)}</p>
      <ol class="ladder" aria-label="Ranks">${ladder}</ol>
      <p class="nudge">${nudge}</p>
      <div class="share">
        <button class="primary" id="copy">Copy my score</button>
        <a class="secondary" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(SITE_URL)}" target="_blank" rel="noopener">Share on LinkedIn</a>
      </div>
      <p class="share-hint" id="copyStatus" role="status">Copies your score and a 🟩🟥 grid, ready to paste in the comments.</p>`;
  }

  const retryLabel = missed === 1
    ? (practice ? "Retry the one still missed" : "Retry the one I missed")
    : (practice ? `Retry the ${missed} still missed` : `Retry the ${missed} I missed`);

  const items = results.map((r, pos) => {
    const q = questions[r.qi];
    return `
      <li class="rv-item ${r.correct ? "good" : "bad"}" id="rv-${pos}">
        <button class="rv-head" aria-expanded="false" aria-controls="rvb-${pos}">
          <span class="rv-mark">${r.correct ? CHECK : CROSS}<span class="sr-only">${r.correct ? "Correct" : "Missed"}:</span></span>
          <span class="rv-text">
            <span class="rv-term"><span class="rv-num">${pos + 1}.</span>${esc(q.options[q.answer])}</span>
            <span class="rv-scn">${esc(q.scenario)}</span>
          </span>
          ${CHEV}
        </button>
        <div class="rv-body" id="rvb-${pos}" hidden>
          ${r.correct ? "" : `<p class="rv-pick">You picked ${esc(q.options[r.picked])}.</p>`}
          <p>${esc(q.right)}</p>
          <p>${esc(q.other)}</p>
        </div>
      </li>`;
  }).join("");

  const hier = levels.map(l => `
    <button class="level" aria-expanded="false" style="--w:${l.w};--bg:${l.bg};--fg:${l.fg};">
      ${esc(l.name)}
      <span class="level-detail">${esc(l.text)}</span>
    </button>`).join("");

  app.innerHTML = `
    ${progressBar()}
    <section class="score-card" aria-label="Your score">
      <p class="eyebrow">${practice ? "Practice round" : "Your score"}</p>
      <div class="gauge">
        ${gaugeSvg()}
        <div class="gauge-center">
          <p class="score-num"><span id="num">${reduceMotion ? score : 0}</span><small>/${total}</small></p>
          <p class="gauge-sub">correct</p>
        </div>
      </div>
      <p class="gauge-hint">Tap a segment to revisit that question</p>
      ${middle}
      <div class="more">
        ${missed ? `<button class="secondary" id="retry">${retryLabel}</button>` : ""}
        <button class="link-btn" id="again">${practice ? "Take the full quiz again" : "Take the quiz again"}</button>
      </div>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist" aria-label="Results details">
        <button role="tab" id="tab-review" data-tab="review" aria-controls="panel-review" aria-selected="true">Your answers</button>
        <button role="tab" id="tab-hier" data-tab="hier" aria-controls="panel-hier" aria-selected="false" tabindex="-1">Waste hierarchy</button>
      </div>

      <div role="tabpanel" id="panel-review" aria-labelledby="tab-review">
        <div class="rv-top">
          <p class="rv-hint">Tap a question to see the explanation again.</p>
          <div class="filter" role="group" aria-label="Show">
            <button data-f="all" aria-pressed="true">All ${total}</button>
            <button data-f="missed" aria-pressed="false"${missed ? "" : " disabled"}>Missed ${missed}</button>
          </div>
        </div>
        <ol class="rv-list">${items}</ol>
      </div>

      <div role="tabpanel" id="panel-hier" aria-labelledby="tab-hier" hidden>
        <p class="hier-intro">Most of these terms map onto one simple idea. The higher up an option sits, the better it usually is for the environment. Tap a level to see what it means.</p>
        <p class="end-label">Most preferred</p>
        <div class="hierarchy">${hier}</div>
        <p class="end-label last">Least preferred</p>
        <p class="note">The hierarchy follows the order set out in the EU Waste Framework Directive. In practice, the best option can depend on the material and the local context.</p>
      </div>
    </section>

    <p class="credit">${creditHtml}</p>
  `;

  app.querySelectorAll(".seg").forEach(s => s.addEventListener("click", () => openReview(parseInt(s.dataset.pos, 10))));
  app.querySelectorAll(".rv-head").forEach(b => { b.onclick = () => toggleItem(b.closest(".rv-item")); });
  app.querySelectorAll(".filter button").forEach(b => { b.onclick = () => setFilter(b.dataset.f); });

  const tabs = Array.from(app.querySelectorAll('[role="tab"]'));
  tabs.forEach((t, i) => {
    t.onclick = () => selectTab(t.dataset.tab);
    t.onkeydown = e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const other = tabs[(i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length];
      selectTab(other.dataset.tab);
      other.focus();
    };
  });

  app.querySelectorAll(".level").forEach(btn => {
    btn.onclick = () => btn.setAttribute("aria-expanded", String(btn.getAttribute("aria-expanded") !== "true"));
  });

  const retry = document.getElementById("retry");
  if (retry) retry.onclick = () => startRound(missedIdx, true);
  document.getElementById("again").onclick = () => startRound(allIndices(), false);
  const copyBtn = document.getElementById("copy");
  if (copyBtn) copyBtn.onclick = () => copyScore(copyBtn, score, total);

  const numEl = document.getElementById("num");
  if (!reduceMotion) {
    let n = 0;
    const timer = setInterval(() => {
      if (!numEl.isConnected) { clearInterval(timer); return; }
      numEl.textContent = n;
      if (n >= score) {
        clearInterval(timer);
        const celebrate = practice ? score === total : score >= 8;
        if (celebrate) burst(numEl, score === total ? 70 : 45);
      }
      n++;
    }, 110);
  }
}

renderIntro();
</script>
</body>
</html>
